# Deploys website/ to GitHub Pages (https://alireza29675.github.io/desk/).
#
# Pages must be enabled with build_type=workflow BEFORE this workflow first
# fires, or the deploy step fails:
#   gh api repos/Alireza29675/desk/pages -X POST -f build_type=workflow
#
# website/ lives outside the packages/* workspace glob, so it has its own
# committed bun.lock and the install runs INSIDE website/ — a root `bun install`
# never installs a nested non-workspace package.json.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  # PRs run the build job only (deploy is gated below) — so the site's first CI
  # build isn't the publish-moment deploy itself.
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin bun to the version that generated website/bun.lock (lockfileVersion 1).
      # This `uses:` step runs at the repo root — it ignores the working-directory
      # default — so without an explicit pin setup-bun reads the root
      # package.json's `packageManager: bun@1.1.42`, which predates this lockfile
      # format and fails `--frozen-lockfile` with InvalidLockfileVersion. The
      # website is a standalone non-workspace package; root/product CI keeps 1.1.42.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Pages steps skip on PRs: they need Pages enabled, and PR runs are a pure
      # build check.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
